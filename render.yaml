services:
  - type: web
    name: oxy-c2
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=client
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/stats
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: PORT
        value: "10000"  # ← Match Render's external port expectation
        
